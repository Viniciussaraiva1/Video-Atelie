<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ateliê Digital — filme completo em Reels</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/reels.css">
</head>
<body>
  <div id="reels">
    <div id="r-marca">ATELIÊ DIGITAL</div>
    <div id="r-topo"><div id="r-num"></div><div id="r-tit"></div></div>

    <!-- o filme principal inteiro, em 16:9, numa janela de 1080 de largura -->
    <div id="janela">
      <div id="stage">
        <div id="scenes"></div>
        <div id="chrome">
          <div id="label"><span id="label-num"></span><span id="label-sep"></span><span id="label-txt"></span></div>
          <div id="mark">ATELIÊ DIGITAL</div>
          <div id="caption"></div>
          <div id="progress"><i></i></div>
          <div id="folio"></div>
        </div>
        <div id="grao"></div>
        <div id="veil"></div>
      </div>
    </div>

    <div id="r-capitulos"></div>
    <div id="r-leg"></div>
    <div id="r-grao"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tatil.js"></script>
  <script src="js/galeria.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/scenes2.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/reels.js"></script>
</body>
</html>
